name: micos-2024
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # Python 核心（下限 3.10：pydantic 模型在运行时求值注解，用到了 X | None 语法）
  - python=3.10
  - pip
  - click
  - pyyaml
  - pydantic>=2

  # 生信工具（micos 主链路）
  - fastqc=0.11.9
  - kneaddata=0.12.0
  - kraken2=2.1.3
  - krona=2.8.1
  - biom-format
  - qiime2=2024.5
  - humann=3.0

  # R 与 R 包（scripts/ 差异丰度分析）
  - r-base=4.3.0
  - r-essentials
  - bioconductor-phyloseq
  - bioconductor-deseq2
  - r-vegan
  - r-ggtree

  # 通用工具
  - pigz
  - samtools

  # Python pip 段
  - pip:
    - kraken-biom==1.2.0
    # scripts/ 独立分析脚本依赖（按需）
    - biopython>=1.79
    - numpy>=1.21.0
    - pandas>=1.3.0
    - scipy>=1.7.0
    - matplotlib>=3.4.0
    - seaborn>=0.11.0
    - scikit-learn>=1.0.0
    - networkx>=2.6.0
